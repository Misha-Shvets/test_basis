services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - local.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments -d payments"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  migrations:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - local.env
    command: ["alembic", "upgrade", "head"]
    restart: on-failure:5
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - local.env
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      migrations:
        condition: service_completed_successfully

  consumer:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - local.env
    restart: unless-stopped
    command: ["faststream", "run", "worker:app"]
    depends_on:
      migrations:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

volumes:
  postgres_data:
  rabbitmq_data:
