services:
  test:
    build:
      context: .
      dockerfile: Dockerfile
    restart: "no"
    working_dir: /app
    env_file:
      - local.env
    volumes:
      - ./tests:/app/tests
    command: ["sh", "-c", "uv sync --extra dev --no-install-project && python -m pytest -q"]
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: "no"
    env_file:
      - local.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments -d payments"]
      interval: 5s
      timeout: 5s
      retries: 10
    expose:
      - "5432"
    tmpfs:
      - /var/lib/postgresql/data
