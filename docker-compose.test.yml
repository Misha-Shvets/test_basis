services:
  test:
    build:
      context: .
      dockerfile: Dockerfile
    restart: "no"
    working_dir: /app
    volumes:
      - ./app:/app/app
      - ./tests:/app/tests
    environment:
      DATABASE_URL: postgresql+psycopg://payments:payments@postgres:5432/payments
      PYTHONPATH: /app/app
      TEST_DATABASE_URL: postgresql+psycopg://payments:payments@postgres:5432/payments
      API_KEY: test-api-key
    command: ["sh", "-c", "uv sync --extra dev --no-install-project && python -m pytest -q"]
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: "no"
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments -d payments"]
      interval: 5s
      timeout: 5s
      retries: 10
    expose:
      - "5432"
    tmpfs:
      - /var/lib/postgresql/data
